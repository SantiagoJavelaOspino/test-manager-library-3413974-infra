version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: manager_library_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-manager_library}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - library_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manager_library"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: manager_library_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Manager Library"
      APP_ENV: production
      APP_KEY: ${APP_KEY:-base64:c29tZXJhbmRvbXNlY3JldGtleWZvcmFwaTEyMzQ1Ng==}
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-manager_library}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-manager_library_super_secret_jwt_key_adso_3413974}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - library_net

  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    container_name: manager_library_app
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - library_net

  page:
    build:
      context: ../page
      dockerfile: Dockerfile
    container_name: manager_library_page
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - library_net

volumes:
  pgdata:
    driver: local

networks:
  library_net:
    driver: bridge
